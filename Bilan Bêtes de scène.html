<title>Bilan Bêtes de scène</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap">
<style>
/* Même structure que le bilan de l'unité 1 : une colonne étroite, des cartes nettes, un retour immédiat. */
:root {
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f4f5f1;
  --surface: #ffffff;
  --fg: #1c2430;
  --muted: #5b6676;
  --line: #d6dad2;
  --accent: #2f5d8a;
  --accent-fg: #ffffff;
  --ok: #2a7a5c;
  --ko: #b0402b;
  --ok-bg: #e3f1eb;
  --ko-bg: #f7e5e0;
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a22; --surface: #1c2530; --fg: #e8ebef; --muted: #a3adbb;
    --line: #2f3b4a; --accent: #8fb6de; --accent-fg: #101820;
    --ok: #7fd1ae; --ko: #f29b84; --ok-bg: #1d3a2e; --ko-bg: #3e2420;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a22; --surface: #1c2530; --fg: #e8ebef; --muted: #a3adbb;
  --line: #2f3b4a; --accent: #8fb6de; --accent-fg: #101820;
  --ok: #7fd1ae; --ko: #f29b84; --ok-bg: #1d3a2e; --ko-bg: #3e2420;
  color-scheme: dark;
}
body {
  margin: 0;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.55 var(--body);
}
.wrap { max-width: 680px; margin: 0 auto; }
header { margin-bottom: 20px; }
.kicker { margin: 0 0 4px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
h1 { margin: 0 0 8px; font: 500 2.1rem/1.15 var(--display); text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 52ch; }
h2 { margin: 0 0 4px; font: 500 1.6rem/1.2 var(--display); }
.rule { margin: 0 0 16px; color: var(--muted); max-width: 60ch; }

.menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.tile {
  text-align: left; cursor: pointer; font: inherit; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px; min-width: 0;
}
.tile strong { display: block; font: 500 1.15rem/1.25 var(--display); margin-bottom: 4px; }
.tile span { color: var(--muted); font-size: 14px; }
.tile:hover { border-color: var(--accent); }

.play-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.score { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.prompt { margin: 0; font: 500 1.35rem/1.5 var(--display); text-wrap: pretty; }
.choices { display: grid; gap: 8px; margin-top: 16px; }
button.choice {
  text-align: left; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; cursor: pointer;
}
button.choice:hover:not(:disabled) { border-color: var(--accent); }
button.choice.right { border-color: var(--ok); background: var(--ok-bg); }
button.choice.wrong { border-color: var(--ko); background: var(--ko-bg); }
button.choice:disabled { cursor: default; }

.answer { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.answer input {
  flex: 1 1 180px; min-width: 0; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
.answer input:disabled { opacity: .75; }

.feedback { min-height: 1.6em; margin-top: 14px; }
.feedback.good { color: var(--ok); }
.feedback.bad { color: var(--ko); }

.actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
button.primary {
  background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px;
  padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer;
}
button.ghost {
  background: transparent; color: var(--accent); border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer;
}
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.foot { margin-top: 24px; color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.tab {
  font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 999px; cursor: pointer;
  background: transparent; color: var(--muted); border: 1px solid var(--line);
}
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.film { margin: 22px 0 10px; font: 500 1.2rem/1.3 var(--display); }
.story { margin: 0; font: 1.05rem/2 var(--body); text-wrap: pretty; }
.cloze select {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 2px 6px; margin: 0 2px;
}
.cloze select.right { border-color: var(--ok); background: var(--ok-bg); }
.cloze select.wrong { border-color: var(--ko); background: var(--ko-bg); }
.cloze button.primary { margin-top: 16px; }
</style>

<main class="wrap">
  <header>
    <p class="kicker">Bilan · Unité 4 · B1</p>
    <h1>Bilan Bêtes de scène</h1>
    <p class="lede">Choisis un thème et entraîne-toi autant que tu veux. Les phrases changent à chaque question.</p>
  </header>

  <div id="menu-wrap">
    <div class="tabs" role="tablist">
      <button id="t-themes" class="tab" type="button" role="tab" aria-selected="true">Thèmes</button>
      <button id="t-extraits" class="tab" type="button" role="tab" aria-selected="false">Extraits étudiés</button>
    </div>
    <div id="tab-themes"><div id="grid-themes" class="menu"></div></div>
    <div id="tab-extraits" hidden><div id="grid-extraits"></div></div>
  </div>

  <section id="play" hidden>
    <div class="play-head">
      <button id="back" class="ghost" type="button">← Tous les thèmes</button>
      <span id="score" class="score"></span>
    </div>
    <h2 id="mode-title"></h2>
    <p id="rule" class="rule"></p>

    <div class="card">
      <p id="prompt" class="prompt" aria-live="polite"></p>
      <div id="choices" class="choices" hidden></div>
      <form id="form" class="answer" autocomplete="off">
        <input id="input" aria-label="Ta réponse">
        <button class="primary" type="submit">Vérifier</button>
      </form>
      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
    </div>

    <div class="actions">
      <button id="listen" class="ghost" type="button" hidden>Écouter</button>
      <button id="next" class="primary" type="button" hidden>Question suivante</button>
    </div>
  </section>

  <p class="foot">Pas de limite : tu peux refaire un thème autant de fois que tu veux.</p>
</main>

<script>
/* ---------- Outils ---------- */
const el = id => document.getElementById(id);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const norm = s => String(s).toLowerCase().replace(/[’`]/g, "'").replace(/\s+/g, ' ').trim();
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* Tirage d'une question à choix : une bonne réponse et des distracteurs. */
function choiceGen(prompt, ok, d, explain, nd = 2) {
  const opts = shuffle([pick(ok), ...shuffle(d).slice(0, nd)]);
  return { prompt, options: opts, check: v => ok.includes(v), explain, answerText: ok.join(' ou ') };
}

/* ---------- 1. Gérondif et participe présent (saisie) ---------- */
const GER = [
  { p: 'Elle écoute la radio ___ (faire) la cuisine.', a: 'en faisant', e: 'Gérondif : « en » + participe présent. Il exprime la simultanéité.' },
  { p: 'Il lit le journal ___ (boire) son café.', a: 'en buvant', e: 'Gérondif : « en » + participe présent. Ici, les deux actions sont en même temps.' },
  { p: 'Nous avons appris beaucoup de choses ___ (lire) des livres.', a: 'en lisant', e: 'Gérondif : il exprime le moyen ou la manière.' },
  { p: 'Il est tombé ___ (courir) dans le couloir.', a: 'en courant', e: 'Gérondif : il exprime la manière ou la circonstance.' },
  { p: 'Les spectateurs, ___ (applaudir), se sont levés.', a: 'applaudissant', e: 'Participe présent sans « en » : il remplace « qui applaudissaient ». Il est invariable.' },
  { p: 'Un acteur ___ (jouer) dans ce film a reçu un prix.', a: 'jouant', e: 'Participe présent : il remplace « qui joue ».' },
  { p: '___ (être) fatigué, il est rentré tôt.', a: 'étant', e: 'Participe présent irrégulier de « être ». Il exprime la cause.' },
  { p: '___ (savoir) la réponse, elle a levé la main.', a: 'sachant', e: 'Participe présent irrégulier de « savoir ».' },
  { p: 'Les enfants ___ (jouer) dans le jardin ont crié.', a: 'jouant', e: 'Participe présent : il décrit les enfants, comme une relative.' },
  { p: 'Elle a découvert ce restaurant ___ (se promener) dans le quartier.', a: 'en se promenant', e: 'Gérondif d’un verbe pronominal : « en se promenant ».' }
];
function genGer() {
  const it = pick(GER);
  return { prompt: it.p, check: v => norm(v) === norm(it.a), answerText: it.a, explain: it.e };
}

/* ---------- 2. Plus-que-parfait (saisie, généré) ---------- */
const PQP_VERBS = [
  { inf: 'partir', pp: 'parti', aux: 'être' }, { inf: 'arriver', pp: 'arrivé', aux: 'être' },
  { inf: 'sortir', pp: 'sorti', aux: 'être' }, { inf: 'voir', pp: 'vu', aux: 'avoir' },
  { inf: 'prendre', pp: 'pris', aux: 'avoir' }, { inf: 'lire', pp: 'lu', aux: 'avoir' },
  { inf: 'manger', pp: 'mangé', aux: 'avoir' }, { inf: 'finir', pp: 'fini', aux: 'avoir' }
];
const PQP_OBJ = ['le film', 'le spectacle', 'la série', 'le concert', 'le cirque'];
const PQP_CTX = ['Quand nous sommes arrivés au cinéma,', 'Quand je suis rentré,', 'Hier soir, quand j’ai allumé la télé,', 'Quand le rideau s’est levé,'];
function genPqp() {
  const v = pick(PQP_VERBS);
  const s = pick(['il', 'elle', 'ils', 'elles']);
  const fem = s === 'elle' || s === 'elles';
  const pl = s === 'ils' || s === 'elles';
  const aux = v.aux === 'avoir'
    ? (pl ? 'avaient' : 'avait')
    : (pl ? 'étaient' : 'était');
  let pp = v.pp;
  if (v.aux === 'être') { if (fem) pp += 'e'; if (pl && !pp.endsWith('s')) pp += 's'; }
  const ans = `${aux} ${pp}`;
  const subj = { il: 'Il', elle: 'Elle', ils: 'Ils', elles: 'Elles' }[s];
  return {
    prompt: `${pick(PQP_CTX)} ${s} ___ (${v.inf}) ${pick(PQP_OBJ)}.`,
    check: x => norm(x) === norm(ans),
    answerText: ans,
    explain: 'Plus-que-parfait : imparfait de « avoir » ou « être » + participe passé. Il marque une action qui a eu lieu avant une autre action du passé.'
  };
}

/* ---------- 3. Dont (choix) ---------- */
const DONT = [
  { p: 'C’est le spectacle ___ je me souviens depuis dix ans.', ok: ['dont'], d: ['que', 'où'], e: '« Se souvenir de » demande « de » : on utilise « dont ».' },
  { p: 'Voici le film ___ tout le monde parle en ce moment.', ok: ['dont'], d: ['que', 'où'], e: '« Parler de » demande « de » : on utilise « dont ».' },
  { p: 'C’est la chanteuse ___ je connais le répertoire.', ok: ['dont'], d: ['que', 'où'], e: '« Connaître le répertoire de » : « dont ».' },
  { p: 'C’est le cirque ___ la ville est fière.', ok: ['dont'], d: ['que', 'où'], e: '« Être fier de » : « dont ».' },
  { p: 'C’est le spectacle ___ on parle dans le journal.', ok: ['dont'], d: ['que', 'où'], e: '« Parler de » : « dont ».' },
  { p: 'Voici les jongleurs ___ je connais les numéros.', ok: ['dont'], d: ['que', 'qui'], e: '« Connaître les numéros de » : « dont ».' },
  { p: 'C’est une série ___ j’ai entendu le titre.', ok: ['dont'], d: ['que', 'où'], e: '« Entendre le titre de » : « dont ».' },
  { p: 'C’est l’acteur ___ la voix est magnifique.', ok: ['dont'], d: ['que', 'qui'], e: 'Dont + possessif : « dont la voix est magnifique » (la voix de l’acteur).' },
  { p: 'Le film ___ tu m’as parlé est sorti hier.', ok: ['dont'], d: ['que', 'où'], e: '« Parler de » : « dont ».' },
  { p: 'C’est la chanson ___ je me souviens du refrain.', ok: ['dont'], d: ['que', 'où'], e: '« Se souvenir de » : « dont ».' },
];
function genDont() { const it = pick(DONT); return choiceGen(it.p, it.ok, it.d, it.e, 2); }

/* ---------- 4. Vocabulaire du spectacle et du cinéma (choix) ---------- */
const VOC_SPEC = [
  { p: 'Un artiste qui marche sur un fil est un ___.', ok: ['funambule'], d: ['dompteur', 'jongleur', 'clown'], e: 'Le funambule marche sur un fil tendu.' },
  { p: 'Une personne qui dresse des animaux est un ___.', ok: ['dompteur'], d: ['funambule', 'jongleur'], e: 'Le dompteur travaille avec les animaux du cirque.' },
  { p: 'Un artiste qui fait tourner des objets en l’air est un ___.', ok: ['jongleur'], d: ['clown', 'dompteur'], e: 'Le jongleur lance et rattrape des objets.' },
  { p: 'Le grand toit de toile d’un cirque s’appelle le ___.', ok: ['chapiteau'], d: ['balcon', 'guichet'], e: 'Le chapiteau est la grande tente du cirque.' },
  { p: '« Se divertir » veut dire…', ok: ['s’amuser, passer un bon moment'], d: ['s’endormir', 'se fâcher'], e: 'Se divertir, c’est s’amuser et oublier ses soucis.' }
];
const VOC_CINE = [
  { p: '« Divulgâcher » veut dire…', ok: ['révéler la fin d’une histoire'], d: ['acheter un billet', 'critiquer un acteur'], e: 'Divulgâcher, c’est dévoiler l’intrigue ou la fin avant les autres.' },
  { p: '« Choisir au pif » veut dire…', ok: ['choisir au hasard'], d: ['choisir avec soin', 'choisir en groupe'], e: 'Au pif = au hasard, sans réfléchir.' },
  { p: 'Une série est divisée en saisons, et chaque saison en ___.', ok: ['épisodes'], d: ['chapitres', 'scènes'], e: 'On parle d’épisodes pour une série télévisée.' },
  { p: 'Les Trois Mousquetaires est un film de cape et ___.', ok: ['d’épée'], d: ['de sabre', 'd’armure'], e: 'Film de cape et d’épée : le mot est « épée ».' },
  { p: 'Être ___ dans son canapé, c’est être installé mollement, sans énergie.', ok: ['affalé'], d: ['assis', 'couché'], e: 'Être affalé : être vautré, détendu, sans bouger.' }
];
function genVocSpec() { const it = pick(VOC_SPEC); return choiceGen(it.p, it.ok, it.d, it.e); }
function genVocCine() { const it = pick(VOC_CINE); return choiceGen(it.p, it.ok, it.d, it.e); }

/* ---------- 5. Connecteurs (choix) ---------- */
const CONN = [
  { p: '___, je suis resté à la maison.  (= parce qu’il pleuvait)', ok: ['Comme il pleuvait'], d: ['Parce qu’il pleuvait', 'Quand il pleuvait'], e: '« Comme » remplace « parce que » en début de phrase.' },
  { p: '___ je suis arrivé, tout le monde dormait.  (= quand)', ok: ['Lorsque'], d: ['Parce que', 'Soudain'], e: '« Lorsque » remplace « quand » (temps).' },
  { p: 'Soudainement → ___', ok: ['tout à coup'], d: ['parce que', 'lorsque'], e: '« Tout à coup » a le même sens que « soudainement ».' }
];
function genConn() { const it = pick(CONN); return choiceGen(it.p, it.ok, it.d, it.e); }

/* ---------- 6. Proposer et donner son avis (choix) ---------- */
const PROP = [
  { p: 'Pour proposer une sortie à un ami, je dis :', ok: ['Si ça te tente, on pourrait aller voir un spectacle ?'], d: ['Tu es nul.', 'Je ne veux pas.'], e: '« Si ça te tente » et « on pourrait » servent à proposer.' },
  { p: 'Pour proposer un programme à un groupe, je dis :', ok: ['Je vous propose une soirée au théâtre.'], d: ['Vous devez venir.', 'J’ai réservé pour vous, c’est obligatoire.'], e: '« Je vous propose » introduit une proposition de façon polie.' }
];
const AVIS = [
  { p: 'Quelle appréciation est négative ?', ok: ['C’est un navet.'], d: ['C’est magnifique.', 'C’est passionnant.'], e: '« Un navet » : un film très mauvais.' },
  { p: 'Quelle appréciation est positive ?', ok: ['C’est bouleversant.'], d: ['C’est choquant.', 'C’est ennuyant.'], e: '« Bouleversant » : qui touche très fort.' },
  { p: '« Ça me laisse froid » veut dire…', ok: ['je suis indifférent'], d: ['je suis très ému', 'je suis furieux'], e: 'Ça me laisse froid = je ne suis pas touché.' }
];
function genProp() { const it = pick(PROP); return choiceGen(it.p, it.ok, it.d, it.e); }
function genAvis() { const it = pick(AVIS); return choiceGen(it.p, it.ok, it.d, it.e); }

/* ---------- 7. Texte à trous ---------- */
const CLOZE = [
  'Hier soir, nous {{sommes allés|allions}} au cirque. Quand nous {{sommes arrivés|arrivions}}, le spectacle {{avait déjà commencé|commençait}}. Il {{faisait|a fait}} très froid sous le chapiteau, mais le public {{riait|a ri}} sans arrêt.',
  'Le film {{était|a été}} magnifique : l’héroïne {{avait vécu|vivait}} une aventure incroyable avant de rentrer chez elle. Quand la série {{est sortie|sortait}} en 2020, tout le monde en {{parlait|a parlé}} pendant des mois.',
  'Samedi dernier, Léa est allée au théâtre avec ses amis. Quand ils sont arrivés, la pièce {{avait déjà commencé|commençait}}. Léa {{avait oublié|oubliait}} ses billets à la maison, alors elle {{a dû|devait}} retourner les chercher. Elle {{avait promis|promettait}} à ses amis d’être à l’heure, mais le métro {{était tombé|tombait}} en panne.',
  'Quand {{j’ai allumé|j’allumais}} la télé, le film {{avait déjà commencé|commençait}}. Il {{faisait|a fait}} nuit et je {{me suis installé|m’installais}} dans mon canapé. Au bout d’une heure, je {{m’étais endormi|me suis endormi}}.'
];
function parseCloze(src) {
  const parts = [];
  const re = /\{\{([^}]+)\}\}/g;
  let last = 0, m;
  while ((m = re.exec(src))) {
    parts.push(src.slice(last, m.index));
    const [ok, alt] = m[1].split('|');
    parts.push({ ok, alt });
    last = re.lastIndex;
  }
  parts.push(src.slice(last));
  return parts;
}
function genCloze() {
  return {
    cloze: true,
    prompt: 'Lis le récit. Dans chaque liste, choisis la forme juste.',
    parts: parseCloze(pick(CLOZE)),
    explain: 'Imparfait : décor et descriptions. Passé composé : actions précises. Plus-que-parfait : action antérieure.'
  };
}

/* ---------- Extraits étudiés (éloge d'un artiste) ---------- */
const ELOGE = [
  { p: 'Une voix ___ : une voix rare, hors du commun.', ok: ['exceptionnelle'], d: ['ordinaire', 'banale'], e: 'Exceptionnel = unique, hors du commun.' },
  { p: 'Une figure ___ d’un domaine : un symbole.', ok: ['icône'], d: ['figurant', 'spectateur'], e: 'Une icône, c’est un symbole, une figure représentative.' },
  { p: 'Un album qui ___ l’époque : il la marque pour longtemps.', ok: ['marquera'], d: ['oubliera', 'cachera'], e: 'Marquer l’époque = laisser une trace importante.' },
  { p: 'Un ___ intense et unique pour une ville.', ok: ['grand amour'], d: ['petit ennui', 'simple passage'], e: 'Un grand amour : un attachement très fort.' }
];
const CRITIQUE = [
  { p: 'Une critique ___ dit du bien d’un film.', ok: ['positive'], d: ['négative', 'neutre'], e: 'Une critique positive exprime un avis favorable.' },
  { p: 'Pour faire l’éloge d’un artiste, on dit :', ok: ['C’est un artiste exceptionnel, inoubliable.'], d: ['C’est un navet.', 'Ça me laisse de glace.'], e: 'Un éloge exprime une appréciation très positive.' }
];
function genEloge() { const it = pick(ELOGE); return choiceGen(it.p, it.ok, it.d, it.e); }
function genCritique() { const it = pick(CRITIQUE); return choiceGen(it.p, it.ok, it.d, it.e); }

/* ---------- Modes ---------- */
const MODES = [
  { title: 'Gérondif ou participe présent', desc: 'Écris la forme juste.', kind: 'input', gen: genGer,
    rule: 'Le gérondif = « en » + participe présent. Le participe présent est invariable et remplace souvent une relative.' },
  { title: 'Plus-que-parfait', desc: 'Forme l’action antérieure.', kind: 'input', gen: genPqp,
    rule: 'Imparfait de avoir ou être + participe passé. Pour une action qui a eu lieu avant une autre action du passé.' },
  { title: 'Le pronom dont', desc: 'Dont ou avec qui ?', kind: 'choice', gen: genDont,

/* ---------- Phonétique : [ɑ̃] / [ɔ̃] (-ant / -ons ; dans / dont) ---------- */
const PHON_PAIRS = [
  ['chantant', 'chantons'], ['parlant', 'parlons'], ['mangeant', 'mangeons'], ['lisant', 'lisons'],
  ['prenant', 'prenons'], ['écoutant', 'écoutons'], ['dansant', 'dansons'], ['allant', 'allons'],
  ['partant', 'partons'], ['voyant', 'voyons']
];
function genPhonAnt() {
  const pair = pick(PHON_PAIRS);
  const isAnt = Math.random() < 0.5;
  const w = isAnt ? pair[0] : pair[1];
  const right = isAnt ? '[ɑ̃] -ant' : '[ɔ̃] -ons';
  return {
    prompt: 'Écoute le mot. La terminaison est-elle [ɑ̃] (-ant) ou [ɔ̃] (-ons) ?',
    speak: w,
    options: ['[ɑ̃] -ant', '[ɔ̃] -ons'],
    check: v => v === right,
    answerText: right,
    explain: `« ${w} » : -ant se prononce [ɑ̃] (participe présent), -ons se prononce [ɔ̃] (verbe à la forme nous).`
  };
}
function genDansDont() {
  const w = pick(['dans', 'dont']);
  const right = w === 'dans' ? 'dans [ɑ̃]' : 'dont [ɔ̃]';
  return {
    prompt: 'Écoute le mot. Est-ce « dans » ([ɑ̃]) ou « dont » ([ɔ̃]) ?',
    speak: w,
    options: ['dans [ɑ̃]', 'dont [ɔ̃]'],
    check: v => v === right,
    answerText: right,
    explain: '« Dans » se prononce [ɑ̃] (voyelle nasale ouverte) ; « dont » se prononce [ɔ̃] (voyelle nasale arrondie).'
  };
}

/* ---------- Moteur ---------- */
let mode = null, q = null, last = '', good = 0, total = 0;

function updateScore() {
  el('score').textContent = total ? `${good} bonne${good > 1 ? 's' : ''} réponse${good > 1 ? 's' : ''} sur ${total}` : 'Commence quand tu veux';
}

function openMode(m) {
  mode = m; good = 0; total = 0; last = '';
  el('menu-wrap').hidden = true;
  el('play').hidden = false;
  el('mode-title').textContent = m.title;
  el('rule').textContent = m.rule;
  ask();
  el('play').scrollIntoView({ block: 'start' });
}

function home() {
  mode = null; q = null;
  el('play').hidden = true;
  el('menu-wrap').hidden = false;
}

function ask() {
  let g = null;
  for (let i = 0; i < 8; i++) { g = mode.gen(); if (g.prompt !== last) break; }
  last = g.prompt;
  q = g;
  q.done = false;
  if (g.cloze) { askCloze(g); return; }

  el('prompt').textContent = g.prompt;
  const fb = el('feedback');
  fb.textContent = ''; fb.className = 'feedback';
  el('next').hidden = true;

  el('listen').hidden = !g.speak;
  const isChoice = !!g.options;
  const box = el('choices');
  box.innerHTML = '';
  box.className = 'choices';
  box.hidden = !isChoice;
  el('form').hidden = isChoice;
  if (isChoice) {
    g.options.forEach(o => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'choice';
      b.textContent = o;
      b.addEventListener('click', () => answer(o));
      box.appendChild(b);
    });
  } else {
    const input = el('input');
    input.value = '';
    input.disabled = false;
    input.focus();
  }
  updateScore();
}

function answer(val) {
  if (!q || q.done) return;
  q.done = true;
  total++;
  const ok = q.check(val);
  if (ok) good++;

  const fb = el('feedback');
  fb.className = 'feedback ' + (ok ? 'good' : 'bad');
  fb.textContent = (ok ? 'Bravo. ' : 'Pas tout à fait. ') + (q.explain || '');
  if (!ok && q.answerText) fb.textContent += ' Réponse : ' + q.answerText + '.';

  if (q.options) {
    [...el('choices').children].forEach(b => {
      b.disabled = true;
      if (q.check(b.textContent)) b.classList.add('right');
      else if (b.textContent === val) b.classList.add('wrong');
    });
  } else {
    el('input').disabled = true;
  }
  el('next').hidden = false;
  el('next').focus();
  updateScore();
}

function askCloze(g) {
  const box = el('choices');
  box.innerHTML = '';
  box.hidden = false;
  box.className = 'cloze';
  el('form').hidden = true;
  el('next').hidden = true;
  el('listen').hidden = true;
  const fb = el('feedback');
  fb.textContent = ''; fb.className = 'feedback';
  el('prompt').textContent = g.prompt;

  const p = document.createElement('p');
  p.className = 'story';
  g.selects = [];
  g.parts.forEach(part => {
    if (typeof part === 'string') { p.appendChild(document.createTextNode(part)); return; }
    const s = document.createElement('select');
    s.setAttribute('aria-label', 'Choix du temps');
    const ph = document.createElement('option');
    ph.value = ''; ph.textContent = '…';
    s.appendChild(ph);
    shuffle([part.ok, part.alt]).forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      s.appendChild(o);
    });
    p.appendChild(s);
    g.selects.push({ sel: s, ok: part.ok });
  });
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'primary';
  btn.textContent = 'Vérifier le texte';
  btn.addEventListener('click', () => checkCloze(btn));
  box.append(p, btn);
  updateScore();
}

function checkCloze(btn) {
  if (!q || q.done) return;
  q.done = true;
  btn.hidden = true;
  let right = 0;
  const wrong = [];
  q.selects.forEach(s => {
    const ok = s.sel.value === s.ok;
    if (ok) right++; else wrong.push(s.ok);
    s.sel.disabled = true;
    s.sel.classList.add(ok ? 'right' : 'wrong');
  });
  const n = q.selects.length;
  total++;
  const all = right === n;
  if (all) good++;
  const fb = el('feedback');
  fb.className = 'feedback ' + (all ? 'good' : 'bad');
  fb.textContent = all
    ? 'Parfait, tout est juste. '
    : `${right} sur ${n} juste. Réponses : ${wrong.join(', ')}. `;
  fb.textContent += q.explain;
  el('next').hidden = false;
  el('next').focus();
  updateScore();
}

  const s2 = document.createElement('span');

  b.append(s1, s2);

  return b;
}

  const h = document.createElement('h3');
  h.className = 'film';
  h.textContent = FILMS[f];
  const g = document.createElement('div');
  g.className = 'menu';
  MODES.filter(m => m.film === f).forEach(m => g.appendChild(tile(m)));
  gridExtraits.append(h, g);
});
function showTab(name) {
  const themes = name === 'themes';
  el('t-themes').setAttribute('aria-selected', String(themes));
  el('t-extraits').setAttribute('aria-selected', String(!themes));
  el('tab-themes').hidden = !themes;
  el('tab-extraits').hidden = themes;
}
el('t-themes').addEventListener('click', () => showTab('themes'));
el('t-extraits').addEventListener('click', () => showTab('extraits'));

el('back').addEventListener('click', home);
el('next').addEventListener('click', ask);
el('listen').addEventListener('click', () => {
  if (!q || !q.speak) return;
  try {
    if (!('speechSynthesis' in window)) throw new Error('no tts');
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(q.speak);
    u.lang = 'fr-FR';
    u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch (e) {
    el('feedback').className = 'feedback bad';
    el('feedback').textContent = 'Le son n’est pas disponible sur cet appareil.';
  }
});
el('form').addEventListener('submit', e => {
  e.preventDefault();
  if (q && q.done) ask(); else answer(el('input').value);
});
updateScore();
</script>
